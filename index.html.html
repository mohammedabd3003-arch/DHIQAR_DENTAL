  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#f4dcd3"/><path d="M40 150C90 40 310 40 360 150C310 270 90 270 40 150Z" fill="#c94f6b"/><path d="M62 150C110 70 290 70 338 150C290 240 110 240 62 150Z" fill="#3b0d18"/><path d="M70 120C120 62 280 62 330 120L330 92C280 52 120 52 70 92Z" fill="#e47a91"/>${up}${lo}</svg>`;
}

      const after_url=await API.upload(await compress(af,big,q),'after');const before_url=bf&&bf.size?await API.upload(await compress(bf,big,q),'before'):'';
      await API.addCase({title:fd.get('title').trim(),cat:fd.get('cat'),sessions:fd.get('sessions').trim(),note:fd.get('note').trim(),before_url,after_url});
      e.target.reset();$('#pv').innerHTML='';S.at=0;toast('نُشرت الحالة');mine()}catch(er){toast(errMsg(er))}finally{b.disabled=false;b.textContent='نشر الحالة'}};
  const mine=async()=>{const cs=await API.casesOf(S.me.id,false);const m=$('#mine');
    m.innerHTML=cs.length?cs.map(c=>`<div class="it"><img class="th" src="${safeImg(c.after_url)}" alt=""><div class="mid"><b>${esc(c.title)}</b><span>${esc(c.cat)} · ${ago(c.created_at)}${c.hidden?' · <b style="display:inline;color:var(--gum)">أخفتها الإدارة</b>':''}</span></div><div class="ops"><button class="btn sm del" data-x="${esc(c.id)}">حذف</button></div></div>`).join(''):'<div class="empty">لم تنشر حالات بعد.</div>';
    m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>confirm2(b,async()=>{await API.deleteCase(cs.find(c=>c.id===b.dataset.x));S.at=0;toast('حُذفت الحالة');mine()}))};
  mine();
}
function confirm2(b,fn){if(b.dataset.sure!=='1'){const t=b.textContent;b.dataset.sure='1';b.textContent='تأكيد؟';setTimeout(()=>{b.dataset.sure='';b.textContent=t},4000);return}b.disabled=true;fn().catch(er=>{toast(errMsg(er));b.disabled=false})}
function bars(rows){const mx=Math.max(1,...rows.map(r=>r[1]));return`<div class="bars">${rows.map(([l,v])=>`<div class="brow"><span>${esc(l)}</span><span><i style="width:${Math.max(2,v/mx*100)}%"></i></span><span class="num">${v}</span></div>`).join('')}</div>`}
async function dashStats(d){
  $('#dc').innerHTML='<div class="empty">جارٍ الحساب…</div>';
  const cl=(await API.myClicks()).filter(c=>new Date(c.created_at)>Date.now()-30*864e5);const n=k=>cl.filter(c=>c.kind===k).length;
  const days=[];for(let i=13;i>=0;i--){const dt=new Date(Date.now()-i*864e5),key=dt.toDateString();days.push([dt.toLocaleDateString('ar-IQ',{weekday:'short',day:'numeric'}),cl.filter(c=>c.kind!=='view'&&new Date(c.created_at).toDateString()===key).length])}
  $('#dc').innerHTML=`<div class="tiles"><div class="tile"><b>${n('view')}</b><span>زيارة لصفحتك</span></div><div class="tile"><b>${n('wa')}</b><span>تواصل عبر واتساب</span></div><div class="tile"><b>${n('call')}</b><span>ضغطة اتصال</span></div><div class="tile"><b>${d.case_count||0}</b><span>حالة منشورة</span></div></div>
  <div class="box"><h3>تواصل المرضى في آخر 14 يوماً</h3><p style="color:var(--muted);margin-bottom:14px">واتساب واتصال، آخر 30 يوماً في البطاقات أعلاه.</p>${bars(days)}</div>`;
}

/* ================= واجهة الإدارة ================= */
async function pageAdmin(){
  if(!S.me){location.hash='#/login';return}
  if(S.role!=='admin')return setApp(wrapMsg('هذه الصفحة للإدارة فقط.'));
  setApp(wrapMsg('جارٍ تحميل لوحة الإدارة…'));
  const [docs,cases,reps,clicks,tips]=await Promise.all([API.allDoctors(),API.allCases(),API.reports(),API.allClicks(),API.tips()]);
  const pend=docs.filter(d=>d.status==='pending');const DN=id=>docs.find(d=>d.id===id)?.name||'—';
  const T=[['over','نظرة عامة'],['req','طلبات الانضمام',pend.length],['docs','الأطباء'],['cases','الحالات'],['reps','البلاغات',reps.length],['tips','التوعية']];
  const tab=S.tab.admin||(pend.length?'req':'over');
  setApp(`<section class="band" style="padding-bottom:0"><div class="wrap"><div class="sec-head"><div><h2>لوحة الإدارة</h2><p>إدارة الأطباء والحالات والبلاغات.</p></div><button class="btn" id="rf">تحديث</button></div></div></section>
  <nav class="tabs scroll">${T.map(([k,t,n])=>`<button data-t="${k}">${t}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</nav>
  <section class="band"><div class="wrap" id="ac"></div></section>`);
  $('#rf').onclick=()=>pageAdmin();
  const act=async(fn,msg)=>{await fn();S.at=0;toast(msg);pageAdmin()};
  const docRow=d=>`<div class="it">${avatar(d,'sm')}<div class="mid"><b>${nm(d)}</b><span>${[d.spec,d.area,d.phone].filter(Boolean).map(esc).join(' · ')} · ${d.case_count} حالة · انضم ${ago(d.created_at)}</span></div>
    <div class="ops"><span class="pill ${d.status}">${STATUS[d.status]}</span><a class="btn sm" href="#/d/${encodeURIComponent(d.id)}">عرض</a>
    ${d.status!=='approved'?`<button class="btn sm dk" data-a="approve" data-id="${esc(d.id)}">قبول</button>`:''}
    ${d.status==='pending'?`<button class="btn sm del" data-a="reject" data-id="${esc(d.id)}">رفض</button>`:''}
    ${d.status==='approved'?`<button class="btn sm" data-a="verify" data-id="${esc(d.id)}">${d.verified?'إلغاء التوثيق':'توثيق'}</button><button class="btn sm" data-a="feature" data-id="${esc(d.id)}">${d.featured?'إلغاء التمييز':'تمييز'}</button><button class="btn sm del" data-a="suspend" data-id="${esc(d.id)}">إيقاف</button>`:''}
    <button class="btn sm del" data-a="del" data-id="${esc(d.id)}">حذف</button></div></div>`;
  const bindDocs=root=>root.querySelectorAll('[data-a]').forEach(b=>{const id=b.dataset.id,d=docs.find(x=>x.id===id);b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='del'||a==='reject'||a==='suspend')return confirm2(b,()=>act(()=>a==='del'?API.deleteDoctor(id):API.setDoctor(id,{status:a==='reject'?'rejected':'suspended'}),'تم'));
    b.disabled=true;act(()=>API.setDoctor(id,a==='approve'?{status:'approved'}:a==='verify'?{verified:!d.verified}:{featured:!d.featured}),'تم التحديث').catch(er=>{toast(errMsg(er));b.disabled=false})}});
  const go=t=>{S.tab.admin=t;$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));const c=$('#ac');
    if(t==='over'){const n=k=>clicks.filter(x=>x.kind===k).length;const per={};clicks.filter(x=>x.kind!=='view').forEach(x=>per[x.doctor_id]=(per[x.doctor_id]||0)+1);
      const top=Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([id,v])=>[DN(id),v]);const byArea={};docs.filter(d=>d.status==='approved').forEach(d=>byArea[d.area]=(byArea[d.area]||0)+1);
      c.innerHTML=`<div class="tiles"><div class="tile"><b>${docs.filter(d=>d.status==='approved').length}</b><span>طبيب منشور</span></div><div class="tile"><b>${pend.length}</b><span>طلب ينتظر المراجعة</span></div><div class="tile"><b>${cases.length}</b><span>حالة</span></div><div class="tile"><b>${reps.length}</b><span>بلاغ مفتوح</span></div><div class="tile"><b>${n('view')}</b><span>زيارة صفحات (30 يوماً)</span></div><div class="tile"><b>${n('wa')+n('call')}</b><span>تواصل مرضى (30 يوماً)</span></div></div>
      <div class="info"><div class="box"><h3 style="margin-bottom:12px">الأكثر تواصلاً خلال 30 يوماً</h3>${top.length?bars(top):'<p style="color:var(--muted)">لا توجد بيانات بعد.</p>'}</div><div class="box"><h3 style="margin-bottom:12px">الأطباء حسب المنطقة</h3>${Object.keys(byArea).length?bars(Object.entries(byArea).sort((a,b)=>b[1]-a[1])):'<p style="color:var(--muted)">لا يوجد أطباء بعد.</p>'}</div></div>`}
    else if(t==='req'){c.innerHTML=pend.length?`<div class="list">${pend.map(docRow).join('')}</div>`:'<div class="empty">لا توجد طلبات جديدة.</div>';bindDocs(c)}
    else if(t==='docs'){c.innerHTML=`<input class="sel" id="ds" type="search" placeholder="ابحث باسم الطبيب" style="width:100%;max-width:360px;margin-bottom:12px"><div class="list" id="dl"></div>`;
      const draw=q=>{$('#dl').innerHTML=docs.filter(d=>!q||String(d.name).includes(q)).map(docRow).join('')||'<div class="empty">لا يوجد.</div>';bindDocs($('#dl'))};$('#ds').oninput=e=>draw(e.target.value.trim());draw('')}
    else if(t==='cases'){c.innerHTML=cases.length?`<div class="list">${cases.map(x=>`<div class="it"><img class="th" src="${safeImg(x.after_url)}" alt=""><div class="mid"><b>${esc(x.title)}</b><span>${esc(DN(x.doctor_id))} · ${esc(x.cat)} · ${ago(x.created_at)}${x.hidden?' · مخفية':''}</span></div><div class="ops"><button class="btn sm" data-v="${esc(x.id)}">عرض</button><button class="btn sm" data-h="${esc(x.id)}">${x.hidden?'إظهار':'إخفاء'}</button><button class="btn sm del" data-x="${esc(x.id)}">حذف</button></div></div>`).join('')}</div>`:'<div class="empty">لا توجد حالات.</div>';
      bindCaseOps(c)}
    else if(t==='reps'){c.innerHTML=reps.length?`<div class="list">${reps.map(r=>{const x=cases.find(k=>k.id===r.case_id);return`<div class="it">${x?`<img class="th" src="${safeImg(x.after_url)}" alt="">`:''}<div class="mid"><b>${esc(r.reason)}</b><span>${x?esc(x.title)+' · '+esc(DN(x.doctor_id)):'حالة محذوفة'} · ${ago(r.created_at)}${x?.hidden?' · مخفية':''}</span></div><div class="ops">${x?`<button class="btn sm" data-v="${esc(x.id)}">عرض</button>${x.hidden?'':`<button class="btn sm dk" data-h="${esc(x.id)}">إخفاء الحالة</button>`}`:''}<button class="btn sm" data-r="${esc(r.id)}">إغلاق البلاغ</button></div></div>`}).join('')}</div>`:'<div class="empty">لا توجد بلاغات.</div>';
      bindCaseOps(c);c.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{b.disabled=true;act(()=>API.delReport(b.dataset.r),'أُغلق البلاغ')})}
    else{c.innerHTML=`<div class="dash"><div class="box"><h3 style="margin-bottom:12px">نصيحة جديدة للناس</h3><form class="f" id="tf"><label>العنوان<input name="title" required maxlength="100"></label><label>النص<textarea name="body" required maxlength="1000"></textarea></label><button class="btn pri">نشر</button></form></div>
      <div class="list">${tips.map(x=>`<div class="it"><div class="mid"><b>${esc(x.title)}</b><span>${esc(x.body).slice(0,120)}</span></div><button class="btn sm del" data-t="${esc(x.id)}">حذف</button></div>`).join('')||'<div class="empty">لا توجد نصائح.</div>'}</div></div>`;
      $('#tf').onsubmit=e=>{e.preventDefault();const f=e.target;act(()=>API.addTip({title:f.title.value.trim(),body:f.body.value.trim()}),'نُشرت النصيحة').catch(er=>toast(errMsg(er)))};
      c.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>confirm2(b,()=>act(()=>API.delTip(b.dataset.t),'حُذفت')))}
  };
  const bindCaseOps=c=>{c.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const x=cases.find(k=>k.id===b.dataset.v);openCase(x,S.docsAdmin.find(d=>d.id===x.doctor_id))});
    c.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const x=cases.find(k=>k.id===b.dataset.h);b.disabled=true;act(()=>API.setCase(x.id,{hidden:!x.hidden}),x.hidden?'أُظهرت الحالة':'أُخفيت الحالة')});
    c.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>confirm2(b,()=>act(()=>API.deleteCase(cases.find(k=>k.id===b.dataset.x)),'حُذفت الحالة')))};
  S.docsAdmin=docs;
  $$('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));go(tab);
}

/* ================= تشغيل ================= */
window.addEventListener('hashchange',()=>{route();scrollTo(0,0)});
(async()=>{
  try{await API.init()}catch(e){console.error(e);API=Demo();toast('تعذّر الاتصال بـ Supabase، يعمل التطبيق تجريبياً')}
  $('#demoBar').hidden=API.mode!=='demo';
  await refreshUser();
  API.onAuth(async ev=>{if(ev==='PASSWORD_RECOVERY'){location.hash='#/newpass';return}if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')await refreshUser()});
  route();
  if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.host)){try{navigator.serviceWorker.register('sw.js')}catch{}}
})();
}
